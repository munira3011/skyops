# Builds the three independent SkyOps images (backend, frontend, litellm-proxy - see
# docs/architecture.md) and deploys them to Azure Container Apps via infra/bicep/main.bicep.
#
# Auth: uses Azure AD Workload Identity Federation (OIDC) via azure/login - no long-lived Azure
# credential is stored in GitHub. Required repo secrets, none of which are ever echoed or written
# to a file in this workflow:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   - federated app registration
#   AZURE_RESOURCE_GROUP                                      - target resource group
#   AZURE_CONTAINER_REGISTRY                                  - e.g. myregistry.azurecr.io
#   AZURE_CONTAINER_REGISTRY_RESOURCE_ID                      - full ACR resource ID (for AcrPull role assignment)
#   OPENAI_API_KEY, ANTHROPIC_API_KEY                         - upstream provider keys (litellm-proxy only ever sees these, per CLAUDE.md)
#   LITELLM_SHARED_KEY                                        - litellm-proxy's LITELLM_MASTER_KEY == backend's LITELLM_API_KEY
#   SKYOPS_API_KEY, SKYOPS_OPS_API_KEY                        - app auth keys, see backend/.env.example

name: Deploy SkyOps

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "litellm-proxy/**"
      - "infra/bicep/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend, litellm-proxy]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # Docker builds install from requirements.txt (see each Dockerfile's comment), which is
      # generated from pyproject.toml/uv.lock per CLAUDE.md. Fail loudly here rather than
      # silently building a stale image if someone forgot to re-export after `uv add`/`uv remove`.
      - name: Verify requirements.txt is not stale
        working-directory: ${{ matrix.service }}
        run: |
          uv export --format requirements-txt --no-dev -o requirements.txt.check
          # Skip the first 2 lines: uv's autogenerated header embeds the exact -o filename it
          # was exported to, so comparing against a differently-named requirements.txt.check
          # would show that one comment line as "different" on every run, even with byte-
          # identical dependencies (found by actually running this check, not by inspection).
          diff <(tail -n +3 requirements.txt) <(tail -n +3 requirements.txt.check) || {
            echo "::error::${{ matrix.service }}/requirements.txt is out of date - run 'uv export --format requirements-txt --no-dev -o requirements.txt' in ${{ matrix.service }}/ and commit it."
            exit 1
          }
          rm requirements.txt.check

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to container registry
        run: az acr login --name "${REGISTRY%%.*}"

      - name: Build and push image
        working-directory: ${{ matrix.service }}
        run: |
          docker build \
            -t "$REGISTRY/skyops-${{ matrix.service }}:${{ github.sha }}" \
            -t "$REGISTRY/skyops-${{ matrix.service }}:latest" \
            .
          docker push "$REGISTRY/skyops-${{ matrix.service }}:${{ github.sha }}"
          docker push "$REGISTRY/skyops-${{ matrix.service }}:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infra/bicep/main.bicep
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP }}
          template: infra/bicep/main.bicep
          # azure/arm-deploy defaults to treating ANY stderr output as a failure - including
          # Azure CLI's own benign Bicep linter warnings (e.g. use-secure-value-for-secure-
          # inputs, printed to stderr by az itself). Found on the first real deployment: this
          # step reported "Deployment process failed as some lines were written to stderr" even
          # though every resource had actually deployed successfully (verified in the Portal).
          failOnStdErr: false
          parameters: >
            namePrefix=skyops
            registryServer=${{ secrets.AZURE_CONTAINER_REGISTRY }}
            registryResourceId=${{ secrets.AZURE_CONTAINER_REGISTRY_RESOURCE_ID }}
            backendImage=${{ env.REGISTRY }}/skyops-backend:${{ github.sha }}
            frontendImage=${{ env.REGISTRY }}/skyops-frontend:${{ github.sha }}
            litellmProxyImage=${{ env.REGISTRY }}/skyops-litellm-proxy:${{ github.sha }}
            openaiApiKey=${{ secrets.OPENAI_API_KEY }}
            anthropicApiKey=${{ secrets.ANTHROPIC_API_KEY }}
            litellmSharedKey=${{ secrets.LITELLM_SHARED_KEY }}
            skyopsApiKey=${{ secrets.SKYOPS_API_KEY }}
            skyopsOpsApiKey=${{ secrets.SKYOPS_OPS_API_KEY }}
